services:
  - type: web
    name: neuravision
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: SII_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: RATE_LIMIT_ANALYZE_PER_MINUTE
        value: "20"
      - key: MAX_UPLOAD_BYTES
        value: "15728640"
      - key: PYTHON_VERSION
        value: 3.11.9
